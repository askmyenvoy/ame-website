notes: |
  Release Notes 0.2.3
   - Added page-level SEO metadata (title, description, canonical, robots) for homepage, How It Works, Trust & Control, Pricing, Getting Started, About, Privacy, and Terms
   - Added explicit `noindex, follow` metadata for the Coming Soon page to keep placeholder content out of search results
   - Added Next.js metadata routes for crawl infrastructure: `src/app/sitemap.ts` and `src/app/robots.ts`
   - Defined sitemap inventory to include only canonical indexable routes and exclude `/coming-soon`
   - Updated route component compatibility for Next.js metadata export by removing unnecessary client-only directives where needed
   - Validated production readiness with a successful `next build`, including generated `/robots.txt` and `/sitemap.xml`

  Release Notes 0.2.2
   - Added a dedicated hero section on the Trust & Control page with updated trust-and-permissions messaging
   - Added a global footer version label sourced from the system manifest (displayed as "version v0.2.2")
   - Stabilized lint tooling by migrating from deprecated `next lint` to ESLint CLI with shared Next.js core-web-vitals rules
   - Reduced build-time toolchain warnings by pinning the Next.js tracing root and refreshing Browserslist metadata

  Release Notes 0.2.1
   - Improved mobile navigation UX by auto-closing the hamburger menu after link selection
   - Reworked homepage hero copy and removed the temporary hero image
   - Moved Trust content from homepage to a dedicated page and added a new menu entry: Trust & Control
   - Added a new homepage section to frame scheduling costs by Time, Attention, and Momentum with icons
   - Standardized typography system across pages/components using shared global tokens
   - Standardized spacing and layout rhythm across pages/components using shared global spacing tokens
   - Refactored color system to semantic design tokens (action, ink, copy, surface, line, emphasis)
   - Applied updated brand palette through tokenized theming from a single Tailwind configuration source
   - Increased header and footer logo sizes for stronger brand visibility

