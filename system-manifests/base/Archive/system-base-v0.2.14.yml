  Release Notes 0.2.7
   - Reworked the homepage narrative around the paper-planner vs digital-calendar contrast, with a new hero headline and updated supporting copy
   - Added a 1986/2026 comparison visual in the hero (`scheduling_1986.webp`, `scheduling_2026.webp`): side-by-side on desktop, stacked on mobile, inside the existing rounded image frame with a full-height white separator
   - Added per-image caption blocks under each hero visual (year label + paired dialogue lines on `surface-soft` background)
   - Updated hero lead copy for cross-company coordination and replaced the prior coordination link line with "Ask My Envoy takes meeting coordination off your plate." (brand name emphasized in bold)
   - Added a new homepage coordination section after the hero explaining what an Envoy does, with contextual link on "coordination" to `/meeting-coordination`
   - Restructured homepage section backgrounds to alternate `surface-base` / `surface-soft` across hero, coordination, and business-cost sections
   - Reworked the business-cost section with updated title, intro copy, and three reframed cost themes: Productivity cost, Business velocity, and Lost opportunity
   - Preserved contextual discovery links to `/meeting-coordination` and `/cost-of-meeting-coordination` in the new homepage copy placement
   - Updated the final homepage CTA headline to "Stop spending time coordinating meetings."

  Release Notes 0.2.6
   - Added a new `Milestones` page at `/milestones` with editorial timeline content and semantic structure (`h2` milestone headings + `<time>` metadata)
   - Added `Milestones` to desktop and mobile header navigation and included `/milestones` in sitemap indexing
   - Implemented the first full milestone narrative pass from October 2025 to August 2026, including intro foundation context and refined copy edits
   - Standardized page hero patterns into three explicit variants in shared styles: `section-hero-main`, `section-hero-compact`, and `section-hero-content`
   - Applied the new hero pattern mapping across routes: homepage (main), secondary marketing pages (compact), and long-form explanation pages (content/back-link pattern)
   - Updated About page secondary CTA from "See how it works" to "Explore our milestones" linking to `/milestones` with environment-safe relative routing

  Release Notes 0.2.5
   - Investigated CLS regressions with route-level Lighthouse audits on desktop and mobile to compare lab behavior against field data
   - Added CLS diagnostics probe (`src/app/components/ClsProbe.tsx`) to capture layout-shift attribution (largest shift, affected selectors, viewport, route, and navigation context)
   - Added telemetry ingest endpoint (`src/app/api/web-vitals/route.ts`) for structured `[web-vitals]` logging
   - Mounted CLS probe globally in `src/app/layout.tsx` to collect signals across all public routes
   - Validated telemetry flow in Docker dev runtime with successful POST to `/api/web-vitals` and confirmed log emission in container logs
   - Added a new non-navigation explanation page at `/meeting-coordination` with long-form content structure and route-level SEO metadata
   - Linked homepage hero copy ("does that coordination for you") directly to `/meeting-coordination` for contextual discovery
   - Added a contextual return link (`← Back to Ask My Envoy`) at the top of the explanation page
   - Introduced a route-specific minimal header experience for explanation pages (`/meeting-coordination`, `/cost-of-meeting-coordination`) with logo-only header and standard footer
   - Added a second non-navigation explanation page at `/cost-of-meeting-coordination` with matching long-form template and route metadata
   - Linked homepage copy ("rarely feels like a major problem") directly to `/cost-of-meeting-coordination` for contextual discovery
   - Replaced placeholder content with multi-section editorial copy on both explanation pages; `/cost-of-meeting-coordination` remains in-progress for continued refinement
   - Tuned website header/footer shadows to match platform visual depth more closely while preserving existing border separation

